  .cluster { flex: 0 1 auto; min-width: 0; }
  .cluster h2 {

  .cards { display: flex; flex-wrap: wrap; gap: 20px var(--gap); margin: 0; padding: 0; list-style: none; }
  .film { width: 120px; width: clamp(88px, (100cqw - (var(--per-row) - 1) * var(--gap)) / var(--per-row) - 0.5px, 124px); }

  .card { display: block; color: inherit; border: 0; }
  .frame { position: relative; display: block; aspect-ratio: 2 / 3; overflow: hidden; border-radius: 3px; background: var(--frame); }
  .frame::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--ring); pointer-events: none; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .frame.wide::before { content: ""; position: absolute; inset: -12%; background: var(--bg) center / cover; filter: blur(12px); opacity: .55; }
  .frame.wide img { object-fit: contain; }
  .stand-in { display: none; }
  .frame.empty .stand-in {

// Treat the Coen brothers as one director when grouping (their early films credit Joel alone).
const SAME_DIRECTOR = { "Joel Coen": "Joel & Ethan Coen", "Ethan Coen": "Joel & Ethan Coen" };

const root = document.getElementById("films");
const buttons = document.querySelectorAll("button[data-mode]");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const directorsOf = f => [...new Set(f.directors.map(d => SAME_DIRECTOR[d] || d))];
const bySlug = new Map(FILMS.map(f => [f.slug, f]));

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function makeCard(f) {
  const li = el("li", "film");
  const card = el("div", "card");
  card.title = f.original ? f.title + " (" + f.original + ")" : f.title;
  const frame = el("span", "frame");
  frame.dataset.slug = f.slug;
  if (f.poster) {
    const img = new Image();
    img.alt = "";
    img.width = f.w;
    img.height = f.h;
    img.loading = "lazy";
    img.decoding = "async";
    img.src = f.poster;
    if (f.w / f.h > 0.85) {
      frame.classList.add("wide");
      frame.style.setProperty("--bg", 'url("' + f.poster + '")');
    }
    frame.append(img);
  } else {
    frame.classList.add("empty");
  }
  const standIn = el("span", "stand-in", f.title);
  standIn.setAttribute("aria-hidden", "true");
  frame.append(standIn);
  card.append(
    frame,
    el("span", "title", f.title),
    el("span", "meta meta-director", directorsOf(f).join(", ") || "Director TBA"),
    el("span", "meta meta-year", f.year || "TBA")
  );
  li.append(card);
  return li;
}

function groupsFor(mode) {
  const groups = new Map();
  const add = (name, f) => {
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(f);
  };
  for (const f of FILMS) {
    if (mode === "year") add(String(f.year || "TBA"), f);
    else {
      const names = directorsOf(f);
      if (names.length) names.forEach(name => add(name, f));
      else add("TBA", f);
    }
  }
  const list = [...groups].map(([name, films]) => ({ name, films }));
  const tbaLast = (a, b) => (a.name === "TBA") - (b.name === "TBA");
  if (mode === "year") {
    list.sort((a, b) => tbaLast(a, b) || Number(b.name) - Number(a.name));
  } else {
    // Directors with the most films first, then alphabetical; each director's films newest first.
    list.sort((a, b) => tbaLast(a, b) || b.films.length - a.films.length || a.name.localeCompare(b.name));
    list.forEach(g => g.films.sort((a, b) => (b.year || 9999) - (a.year || 9999)));
  }
  return list;
}

const cards = new Map(FILMS.map(f => [f.slug, makeCard(f)]));
let mode = null;

function render(next, animate) {
  // Remember where every poster is, regroup, then glide each poster from its old spot to its new one.
  const before = new Map();
  if (animate) for (const [slug, li] of cards) if (li.isConnected) before.set(slug, li.getBoundingClientRect());

  const used = new Set();
  const clusters = document.createDocumentFragment();
  for (const group of groupsFor(next)) {
    const section = el("section", "cluster");
    const h2 = el("h2", null, group.name);
    if (group.films.length > 1) {
      const count = el("span", "count", String(group.films.length));
      count.append(el("span", "sr", " films"));
      h2.append(" ", count);
    }
    const ul = el("ul", "cards");
    for (const f of group.films) {
      // A film with two directors appears in both clusters.
      ul.append(used.has(f.slug) ? cards.get(f.slug).cloneNode(true) : cards.get(f.slug));
      used.add(f.slug);
    }
    section.append(h2, ul);
    clusters.append(section);
  }
  root.replaceChildren(clusters);
  root.className = "by-" + next;
  mode = next;
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === next)));

  if (!animate || reduceMotion.matches) return;
  for (const [slug, li] of cards) {
    const from = before.get(slug);
    if (!from) continue;
    const to = li.getBoundingClientRect();
    const dx = from.left - to.left;
    const dy = from.top - to.top;
    if (dx || dy) {
      li.animate(
        [{ transform: "translate(" + dx + "px, " + dy + "px)" }, { transform: "none" }],
        { duration: 560, easing: "cubic-bezier(.2, .7, .2, 1)" }
      );
    }
  }
  root.querySelectorAll("h2").forEach(h => h.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 260, fill: "backwards" }));
}

// If a poster link stops working (Wikipedia sometimes renames files), ask Wikipedia for the current one.
document.addEventListener("error", async event => {
  const img = event.target;
  if (!(img instanceof HTMLImageElement)) return;
  const frame = img.closest(".frame");
  if (!frame) return;
  const f = bySlug.get(frame.dataset.slug);
  if (f && f.wiki && !img.dataset.retried) {
    img.dataset.retried = "1";
    try {
      const api = "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*" +
        "&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&pilicense=any&titles=" + encodeURIComponent(f.wiki);
      const page = (await (await fetch(api)).json()).query.pages[0];
      if (page.thumbnail && page.thumbnail.source !== img.src) {
        img.src = page.thumbnail.source;
        return;
      }
    } catch (e) { /* fall through to the stand-in */ }
  }
  frame.classList.remove("wide");
  frame.classList.add("empty");
  img.remove();
}, true);

buttons.forEach(b => b.addEventListener("click", () => {
  if (b.dataset.mode === mode) return;
  render(b.dataset.mode, true);
  history.replaceState(null, "", b.dataset.mode === "director" ? "#director" : location.pathname + location.search);
}));

// Light/Dark toggle. Until the visitor picks one, the page follows the device setting.
const themeButtons = document.querySelectorAll("button[data-theme]");
const darkDevice = window.matchMedia("(prefers-color-scheme: dark)");
function showTheme() {
  const theme = document.documentElement.dataset.theme || (darkDevice.matches ? "dark" : "light");
  themeButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.theme === theme)));
}
themeButtons.forEach(b => b.addEventListener("click", () => {
  document.documentElement.dataset.theme = b.dataset.theme;
  try { localStorage.setItem("theme", b.dataset.theme); } catch (e) { /* choice lasts until the page closes */ }
  showTheme();
}));
darkDevice.addEventListener("change", showTheme);
showTheme();

document.getElementById("theme").hidden = false;
document.querySelector(".controls").hidden = false;
render(location.hash === "#director" ? "director" : "year", false);
</script>
